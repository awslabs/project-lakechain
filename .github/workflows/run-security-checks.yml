name: Run security checks on the project

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      # Checkout and setup.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # Set node version.
      - name: Set node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      
      # Install dependencies.
      - name: Install dependencies
        run: npm install
      
      # NPM audit.
      - name: Run audit
        run: npm audit

      # GitLeaks.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # Checkov.
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@d403349a9193cf87f58f18a0f09aab1e9e058bde
        with:
          output_format: cli,sarif
          output_file_path: console,results.sarif
          skip_check: CKV_DOCKER_2,CKV_DOCKER_3

      # Bandit.
      - name: Run Bandit
        uses: tj-actions/bandit@d7f9d3e6020f1b252bc82edd32757ba5bf115f16
        with:
          targets: './packages'
          options: '-r -c bandit.yml'

  docs-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        run: npm ci

      - name: Audit documentation dependencies
        run: npm audit

      - name: Build documentation
        run: npm run build
        env:
          ASTRO_SITE: https://awslabs.github.io
