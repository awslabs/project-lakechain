name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  pull_request:
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Lint the code and check for spelling errors.
  lint:
    uses: ./.github/workflows/run-lint.yml

  # Build the documentation.
  build:
    needs: lint
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install, build, and upload documentation
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853
        with:
          path: ./docs
          node-version: 24
          package-manager: npm@11.12.0

  # Deploy the documentation to GitHub Pages.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
